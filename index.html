<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MGM 2026 Registration App</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 15px;
            background-color: #f4f6f9;
            text-align: center;
        }
        h1 { color: #2c3e50; margin-bottom: 5px; font-size: 24px;}
        .subtitle { color: #7f8c8d; margin-top: 0; margin-bottom: 20px; font-size: 14px;}
        
        #scanner-container {
            max-width: 450px;
            margin: 0 auto;
            background: white;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        #reader { width: 100%; border-radius: 8px; overflow: hidden; background: #eee;}
        
        #status-msg {
            margin: 10px;
            font-size: 14px;
            color: #e67e22;
            font-weight: bold;
        }

        #result-card {
            max-width: 450px;
            margin: 20px auto 0 auto;
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            display: none; 
            text-align: left;
        }
        .guest-name { font-size: 24px; font-weight: bold; color: #1a252f; margin-bottom: 5px; }
        .guest-meta { font-size: 14px; color: #555; margin-bottom: 15px; border-bottom: 1px solid #eee; padding-bottom: 10px;}
        
        .badge {
            padding: 12px 15px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 16px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            color: white;
        }
        .concert-badge { background-color: #f1c40f; }
        .no-concert-badge { background-color: #95a5a6; }
        
        .workshop-title { font-size: 14px; text-transform: uppercase; letter-spacing: 1px; color: #7f8c8d; font-weight: bold; margin-top: 15px;}
        
        .workshop-name-display {
            font-size: 16px;
            font-weight: bold;
            color: #2c3e50;
            margin: 5px 0 10px 0;
            background: #f8f9fa;
            padding: 10px;
            border-left: 4px solid #34495e;
            border-radius: 4px;
        }

        .wristband-alert {
            font-size: 20px;
            font-weight: 900;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            border: 3px dashed #333;
            margin-top: 5px;
        }
        
        .warning-banner {
            background-color: #e74c3c;
            color: white;
            padding: 10px;
            border-radius: 8px;
            font-weight: bold;
            text-align: center;
            margin-bottom: 15px;
        }
        
        .action-btn {
            width: 100%;
            padding: 12px;
            background: #3498db;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <h1>MGM 2026 Registration App</h1>
    <p class="subtitle">Volunteer Scanning Console</p>

    <div id="scanner-container">
        <div style="margin-bottom: 15px; position: relative;">
            <div style="padding: 10px; background: #eef2f7; border-radius: 8px; display: flex; gap: 8px;">
                <input type="text" id="txt-search" oninput="handleSearchTyping()" placeholder="Type Name or Phone Number..." style="flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px;" autocomplete="off">
                <button onclick="manualSearchGuest()" style="padding: 10px 15px; background: #2c3e50; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 14px;">SEARCH</button>
            </div>
            
            <!-- Custom On-Screen Autocomplete Dropdown Box -->
            <div id="custom-suggestions" style="display: none; position: absolute; top: 100%; left: 0; right: 0; background: white; border: 1px solid #ccc; border-radius: 6px; max-height: 200px; overflow-y: auto; z-index: 9999; box-shadow: 0px 4px 12px rgba(0,0,0,0.15); margin-top: 4px;">
            </div>
        </div>
        <div id="status-msg">Connecting to database...</div>
        <div id="reader"></div>
    </div>

    <div id="result-card">
        <div id="checkin-warning" class="warning-banner" style="display:none;">⚠️ ALREADY CHECKED IN!</div>
        <div class="guest-name" id="lbl-name">John Doe</div>
        <div class="guest-meta" id="lbl-meta">ID: MGM2026_1001</div>
        
        <div id="badge-concert" class="badge concert-badge">
            <span>🎟️ Concert Access:</span> <span>GIVE CONCERT WRISTBAND</span>
        </div>

        <div class="workshop-title">Registered Workshop Name:</div>
        <div id="lbl-workshop-name" class="workshop-name-display">Workshop Text Goes Here</div>

        <div class="workshop-title">Required Wristband Color:</div>
        <div id="lbl-workshop-box" class="wristband-alert">Loading...</div>

        <button class="action-btn" onclick="resetScanner()">NEXT GUEST</button>
    </div>

    <script>
        // 1. PASTE YOUR GOOGLE APPS SCRIPT WEB APP URL HERE
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzgvkomDgtvesulWrgnQE6fPj4QW_CHFFqIQPSHxHuTRgNT0gibGuTP-_46MpythZYJ-g/exec";
    
    let attendeesDatabase = [];
    let html5QrCode;
    let statusMsg;

    // Wait safely for the HTML structure to fully render before looking for elements
    document.addEventListener("DOMContentLoaded", function() {
        statusMsg = document.getElementById('status-msg');
        
        if (statusMsg) {
            statusMsg.innerText = "Connecting to live database...";
        }

        // Pull live data straight from Google Sheets on bootup
        fetch(APPS_SCRIPT_URL)
            .then(response => response.json())
            .then(data => {
                if(data.error) throw new Error(data.error);
                attendeesDatabase = data;
                
                if (statusMsg) {
                    statusMsg.innerText = "Live Cloud DB Loaded. Initializing camera...";
                    statusMsg.style.color = "green";
                }
                
                initScanner();
            })
            .catch(err => {
                if (statusMsg) {
                    statusMsg.style.color = "red";
                    statusMsg.innerText = "❌ Cloud DB Sync Error: " + err.message;
                }
                console.error(err);
            });
    });

    // Active typing controller that renders results cleanly on the screen
    function handleSearchTyping() {
        const inputField = document.getElementById("txt-search");
        const suggestionsBox = document.getElementById("custom-suggestions");
        
        if (!inputField || !suggestionsBox) return;
        
        const query = inputField.value.trim().toLowerCase();
        
        // Clear out dropdown if the entry string is empty or too short
        if (!query || query.length < 1) {
            suggestionsBox.innerHTML = "";
            suggestionsBox.style.display = "none";
            return;
        }

        // Filter rules: Prioritize strings starting with the letters typed (Prefix check)
        let matches = attendeesDatabase.filter(g => {
            const normPhone = g.phone.replace(/[- ]/g, "");
            const cleanQuery = query.replace(/[- ]/g, "");
            return g.name.toLowerCase().startsWith(query) || normPhone.startsWith(cleanQuery);
        });

        // If nothing matches the beginning, look for a general inclusion match
        if (matches.length === 0) {
            matches = attendeesDatabase.filter(g => {
                const normPhone = g.phone.replace(/[- ]/g, "");
                const cleanQuery = query.replace(/[- ]/g, "");
                return g.name.toLowerCase().includes(query) || normPhone.includes(cleanQuery);
            });
        }

        // Render results to the customized interface panel on-screen
        suggestionsBox.innerHTML = "";
        
        if (matches.length > 0) {
            // Take up to top 15 matches to maintain performance limits
            matches.slice(0, 15).forEach(guest => {
                const rowItem = document.createElement("div");
                rowItem.style.padding = "12px 15px";
                rowItem.style.cursor = "pointer";
                rowItem.style.borderBottom = "1px solid #f1f2f6";
                rowItem.style.fontSize = "14px";
                rowItem.style.display = "flex";
                rowItem.style.justifyContent = "space-between";
                rowItem.style.alignItems = "center";
                rowItem.style.textAlign = "left";
                
                // Text presentation elements
                rowItem.innerHTML = `
                    <div>
                        <strong style="color: #2c3e50;">${guest.name}</strong>
                        <div style="font-size: 12px; color: #7f8c8d; margin-top: 2px;">📞 ${guest.phone}</div>
                    </div>
                    <span style="font-size: 11px; padding: 3px 6px; background: #eef2f7; border-radius: 4px; color: #7f8c8d;">
                        ${guest.checkedIn ? "Checked In ✅" : "Ready"}
                    </span>
                `;
                
                // Set up click action listener to pass selection data explicitly
                rowItem.onclick = function() {
                    inputField.value = guest.name;
                    suggestionsBox.innerHTML = "";
                    suggestionsBox.style.display = "none";
                    
                    if (html5QrCode && html5QrCode.isScanning) {
                        html5QrCode.pause();
                    }
                    processGuestCheckIn(guest);
                };
                
                suggestionsBox.appendChild(rowItem);
            });
            suggestionsBox.style.display = "block";
        } else {
            suggestionsBox.style.display = "none";
        }
    }

    // Close dropdown automatically if volunteer taps anywhere outside the box container
    document.addEventListener("click", function(e) {
        const box = document.getElementById("custom-suggestions");
        const searchWrap = document.getElementById("txt-search");
        if (box && searchWrap && e.target !== box && e.target !== searchWrap) {
            box.style.display = "none";
        }
    });

    function getWristbandColor(workshopName) {
        if (!workshopName || workshopName.includes("None of the above")) {
            return { text: "⚠️ NO WORKSHOP WRISTBAND", bg: "#f1f2f6", textClr: "#2f3542" };
        }
        if (workshopName.includes("Vocal Techniques")) return { text: "🔵 BLUE WRISTBAND", bg: "#3498db", textClr: "#ffffff" };
        if (workshopName.includes("Band Dynamics")) return { text: "🔴 RED WRISTBAND", bg: "#e74c3c", textClr: "#ffffff" };
        if (workshopName.includes("歌唱技巧")) return { text: "🟡 YELLOW WRISTBAND", bg: "#f1c40f", textClr: "#2c3e50" };
        if (workshopName.includes("Worship Leading")) return { text: "🟢 GREEN WRISTBAND", bg: "#2ecc71", textClr: "#ffffff" };
        if (workshopName.includes("Music Production")) return { text: "🟠 ORANGE WRISTBAND", bg: "#e67e22", textClr: "#ffffff" };
        
        return { text: "🟡 YELLOW WRISTBAND", bg: "#f1c40f", textClr: "#2c3e50" };
    }

    function initScanner() {
        if (!document.getElementById("reader")) return;
        html5QrCode = new Html5Qrcode("reader");
        const config = { fps: 10, qrbox: { width: 250, height: 250 } };
        html5QrCode.start({ facingMode: "environment" }, config, onScanSuccess)
        .catch(err => {
            if (statusMsg) {
                statusMsg.style.color = "red";
                statusMsg.innerText = "🎥 Camera access error. Check permissions.";
            }
        });
    }

    function onScanSuccess(decodedText, decodedResult) {
        html5QrCode.pause();
        const guest = attendeesDatabase.find(g => g.id === decodedText.trim());
        
        if (!guest) {
            alert("❌ Invalid QR Code! ID " + decodedText + " not in database.");
            html5QrCode.resume();
            return;
        }
        
        processGuestCheckIn(guest);
    }

    // Manual search button fallback functionality logic loop
    function manualSearchGuest() {
        const searchInput = document.getElementById("txt-search").value.trim().toLowerCase();
        if (!searchInput) {
            alert("Please enter a name or phone number to search.");
            return;
        }

        // Look for exact field equivalence matching parameters safely
        const guest = attendeesDatabase.find(g => {
            const normPhone = g.phone.replace(/[- ]/g, "");
            const cleanInput = searchInput.replace(/[- ]/g, "");
            return g.name.toLowerCase() === searchInput || normPhone === cleanInput;
        });

        if (!guest) {
            alert("❌ No exact match found. Please type or select from the options dropdown instead.");
            return;
        }

        if (html5QrCode && html5QrCode.isScanning) {
            html5QrCode.pause();
        }

        processGuestCheckIn(guest);
    }

    function processGuestCheckIn(guest) {
        document.getElementById("lbl-name").innerText = guest.name;
        document.getElementById("lbl-meta").innerText = `ID: ${guest.id} | Phone: ${guest.phone}`;
        
        if (guest.checkedIn) {
            document.getElementById("checkin-warning").style.display = "block";
        } else {
            document.getElementById("checkin-warning").style.display = "none";
            guest.checkedIn = true; 
            syncCheckInToCloud(guest);
        }

        const concertBadge = document.getElementById("badge-concert");
        if (guest.concert) {
            concertBadge.className = "badge concert-badge";
            concertBadge.innerHTML = "<span>🎟️ Concert Access:</span> <b>🎟️ GIVE CONCERT WRISTBAND</b>";
        } else {
            concertBadge.className = "badge no-concert-badge";
            concertBadge.innerHTML = "<span>❌ No Concert Access:</span> <span>Workshop Only</span>";
        }

        document.getElementById("lbl-workshop-name").innerText = guest.workshop;

        const colorMapping = getWristbandColor(guest.workshop);
        const box = document.getElementById("lbl-workshop-box");
        box.innerText = colorMapping.text;
        box.style.backgroundColor = colorMapping.bg;
        box.style.color = colorMapping.textClr;

        document.getElementById("result-card").style.display = "block";
        document.getElementById("scanner-container").style.display = "none";
    }

    function syncCheckInToCloud(guest) {
        statusMsg.innerText = "⏳ Syncing check-in status with Google Sheets...";
        statusMsg.style.color = "#d35400"; 
        
        const formData = new URLSearchParams();
        formData.append("name", guest.name);
        formData.append("phone", guest.phone);
        
        fetch(APPS_SCRIPT_URL, {
            method: 'POST',
            body: formData
        })
        .then(res => res.json())
        .then(resData => {
            if(resData.status === "success") {
                statusMsg.innerText = "✅ Checked-In successfully synced to Cloud!";
                statusMsg.style.color = "green";
            } else {
                statusMsg.innerText = "⚠️ Cloud warning: " + resData.message;
                statusMsg.style.color = "red";
            }
        })
        .catch(err => {
            console.error("Cloud Sync Error: ", err);
            statusMsg.innerText = "❌ Network Error: Sync failed.";
            statusMsg.style.color = "red";
        });
    }

    function resetScanner() {
        document.getElementById("txt-search").value = "";
        const suggestionsBox = document.getElementById("custom-suggestions");
        if (suggestionsBox) {
            suggestionsBox.innerHTML = "";
            suggestionsBox.style.display = "none";
        }
        
        document.getElementById("result-card").style.display = "none";
        document.getElementById("scanner-container").style.display = "block";
        statusMsg.innerText = "🎥 Camera active. Ready to scan!";
        statusMsg.style.color = "green";
        
        if (html5QrCode && html5QrCode.isScanning) {
            html5QrCode.resume();
        }
    }
    </script>
</body>
</html>
